    <style>
        /* ===== Pocket watch clock ===== */
        .pocket-watch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 吊环 bow */
        .pocket-bow {
            position: absolute;
            top: -21%;
            left: 50%;
            width: 30%;
            height: auto;
            transform: translateX(-50%);
            z-index: 1;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        /* 表冠 crown */
        .pocket-crown {
            position: absolute;
            top: 1.5%;
            left: 50%;
            width: 11%;
            height: 7%;
            transform: translateX(-50%);
            border-radius: 3px 3px 2px 2px;
            background: linear-gradient(to bottom,
                #f6f9ff 0%, #cfdcf1 28%, #819ac9 55%,
                #3a4c7d 68%, #6f8abf 88%, #e3ecfa 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.35),
                        inset 0 1px 1px rgba(255,255,255,0.8);
            z-index: 3;
        }

        .pocket-crown::before,
        .pocket-crown::after {
            content: "";
            position: absolute;
            left: 16%;
            right: 16%;
            height: 1px;
            background: rgba(28,38,72,0.7);
        }

        .pocket-crown::before { top: 38%; }
        .pocket-crown::after  { top: 62%; }

        /* 表壳 case — blued steel */
        .watch-case {
            position: absolute;
            inset: 3.5%;
            border-radius: 50%;
            background:
                /* specular bands sweeping around the polished ring */
                conic-gradient(from 200deg,
                    rgba(255,255,255,0)    0deg,
                    rgba(244,248,255,0.78) 28deg,
                    rgba(46,62,110,0.52)  68deg,
                    rgba(255,255,255,0)    115deg,
                    rgba(244,248,255,0.58) 165deg,
                    rgba(36,50,96,0.58)   225deg,
                    rgba(255,255,255,0)    280deg,
                    rgba(244,248,255,0.68) 325deg,
                    rgba(255,255,255,0)    360deg),
                radial-gradient(120% 120% at 30% 24%,
                    #f6f9ff 0%, #d7e2f4 12%, #a8bcde 30%,
                    #7590c2 50%, #3c5085 64%, #5d78ae 76%,
                    #d0ddf1 90%, #4d6299 100%);
            box-shadow: 0 7px 16px rgba(12,20,45,0.45),
                        inset 0 2px 3px rgba(255,255,255,0.95),
                        inset 0 -6px 10px rgba(16,26,58,0.5),
                        inset 4px 0 8px rgba(255,255,255,0.35),
                        inset -4px 0 8px rgba(16,26,58,0.4);
            z-index: 2;
        }

        /* engraved groove inside the case */
        .watch-case::after {
            content: "";
            position: absolute;
            inset: 7.5%;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6),
                        inset 0 1px 2px rgba(0,0,0,0.25);
        }

        .clock-face {
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            /* dial image is transparent line art — supply the white enamel base */
            background-color: #ffffff;
            background-image: url('assets/img/clock/clock.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 0 1.5px #465a8c,
                        inset 0 2px 5px rgba(20,30,60,0.22),
                        inset 0 -2px 4px rgba(255,255,255,0.85);
        }

        /* Hide default numbers since they're included in the dial image */
        .clock-number {
            display: none;
        }

        /* convex glass reflection */
        .clock-glass {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            background:
                radial-gradient(ellipse 62% 40% at 30% 18%,
                    rgba(255,255,255,0.5), rgba(255,255,255,0) 70%),
                linear-gradient(135deg,
                    rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 38%,
                    rgba(255,255,255,0) 70%, rgba(255,255,255,0.12) 100%);
        }
        
        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Remove default background color */
            background-color: transparent !important;
            /* Ensure hands are visible above dial */
            z-index: 10;
        }
        
        .hour-hand {
            width: 15%; /* Adjust based on hand image size */
            height: 30%; /* Adjust based on hand image size */
            /* Use custom hour hand image */
            background-image: url('assets/img/clock/hour-hand.png');
            /* Center the hand horizontally */
            margin-left: -7.5%; /* Half of width */
            /* Ensure hand is oriented correctly */
            transform: rotate(0deg);
        }
        
        .minute-hand {
            width: 10%; /* Adjust based on hand image size */
            height: 40%; /* Adjust based on hand image size */
            /* Use custom minute hand image */
            background-image: url('assets/img/clock/minute-hand.png');
            /* Center the hand horizontally */
            margin-left: -5%; /* Half of width */
            /* Ensure hand is oriented correctly */
            transform: rotate(0deg);
        }
        
        .second-hand {
            width: 5%; /* Adjust based on hand image size */
            height: 45%; /* Adjust based on hand image size */
            /* Use custom second hand image */
            background-image: url('assets/img/clock/second-hand.png');
            /* Center the hand horizontally */
            margin-left: -2.5%; /* Half of width */
            /* Ensure hand is oriented correctly */
            transform: rotate(0deg);
        }
        
        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 35% 30%,
                #f6f9ff, #9ab1d9 55%, #364a82);
            box-shadow: 0 1px 2px rgba(10,18,42,0.45),
                        inset 0 0 0 1px rgba(34,46,86,0.65);
            /* Ensure center is visible above hands and glass */
            z-index: 20;
        }

        .clock-center::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #1f2d58;
        }

        /* ===== Back case (flipped "Be Brave" side) ===== */
        .ih-item.circle.effect .info .info-back {
            position: absolute;
            inset: 3.5%;
            width: auto;
            height: auto;

        .ih-item.circle.effect .info .info-back h2 {

        .ih-item.circle.effect .info .info-back p {

            .ih-item.circle.effect .info .info-back p  { font-size: 7px; }
        }
    </style>

    <script type="text/javascript">
        // Clock functionality to display local time
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            // Calculate angles for each hand
            const hourAngle = (hours * 30) + (minutes * 0.5);
            const minuteAngle = (minutes * 6) + (seconds * 0.1);
            const secondAngle = seconds * 6;
            
            // Update the clock hands
            const hourHand = document.getElementById('hourHand');
            const minuteHand = document.getElementById('minuteHand');
            const secondHand = document.getElementById('secondHand');
            
            if (hourHand && minuteHand && secondHand) {
                // Remove translateX(-50%) since we're using margin-left for centering
                hourHand.style.transform = `rotate(${hourAngle}deg)`;
                minuteHand.style.transform = `rotate(${minuteAngle}deg)`;
                secondHand.style.transform = `rotate(${secondAngle}deg)`;
            }
        }
        
        // Initialize clock and update every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
